# API server: Ethereum JSON-RPC facade, registration and REST API.
# Database migrations run in an init container before every start; they are idempotent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canton-middleware-api
  labels:
    app: canton-middleware-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: canton-middleware-api
  labels:
    app: canton-middleware-api
spec:
  type: ClusterIP
  selector:
    app: canton-middleware-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canton-middleware-api
  labels:
    app: canton-middleware-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canton-middleware-api
  template:
    metadata:
      labels:
        app: canton-middleware-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: canton-middleware-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/chainsafe/canton-erc20-api
          command: ["/bin/sh", "-ec"]
          args:
            - |
              /app/api-server-migrate -config /app/config.yaml init || echo "migration table already present"
              exec /app/api-server-migrate -config /app/config.yaml up
          envFrom:
            - secretRef:
                name: canton-middleware-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      containers:
        - name: api-server
          image: ghcr.io/chainsafe/canton-erc20-api
          command: ["/app/api-server"]
          args: ["-config", "/app/config.yaml"]
          envFrom:
            - secretRef:
                name: canton-middleware-api-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: canton-middleware-api-config
