# Indexer: follows the participant's Ledger API and serves balances, holdings and supply.
# It sees only what this participant's parties can see, so each operator runs its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canton-indexer
  labels:
    app: canton-indexer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: canton-indexer
  labels:
    app: canton-indexer
spec:
  type: ClusterIP
  selector:
    app: canton-indexer
  ports:
    - name: http
      port: 8082
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canton-indexer
  labels:
    app: canton-indexer
spec:
  replicas: 1
  # One indexer per database: a second replica would apply the same ledger events twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: canton-indexer
  template:
    metadata:
      labels:
        app: canton-indexer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: canton-indexer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/chainsafe/canton-indexer
          command: ["/bin/sh", "-ec"]
          args:
            - |
              /app/indexer-migrate -config /app/config.yaml init || echo "migration table already present"
              exec /app/indexer-migrate -config /app/config.yaml up
          envFrom:
            - secretRef:
                name: canton-indexer-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      containers:
        - name: indexer
          image: ghcr.io/chainsafe/canton-indexer
          command: ["/app/indexer"]
          args: ["-config", "/app/config.yaml"]
          envFrom:
            - secretRef:
                name: canton-indexer-secrets
          ports:
            - name: http
              containerPort: 8082
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: canton-indexer-config
