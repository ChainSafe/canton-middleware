# Bridge relayer: moves mapped ERC-20 tokens between Ethereum and Canton.
# Run one replica: it holds the Ethereum relayer key and processes events in order.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canton-bridge-relayer
  labels:
    app: canton-bridge-relayer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: canton-bridge-relayer
  labels:
    app: canton-bridge-relayer
spec:
  type: ClusterIP
  selector:
    app: canton-bridge-relayer
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canton-bridge-relayer
  labels:
    app: canton-bridge-relayer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: canton-bridge-relayer
  template:
    metadata:
      labels:
        app: canton-bridge-relayer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: canton-bridge-relayer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/chainsafe/canton-middleware
          command: ["/bin/sh", "-ec"]
          args:
            - |
              /app/relayer-migrate -config /app/config.yaml init || echo "migration table already present"
              exec /app/relayer-migrate -config /app/config.yaml up
          envFrom:
            - secretRef:
                name: canton-bridge-relayer-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      containers:
        - name: relayer
          image: ghcr.io/chainsafe/canton-middleware
          command: ["/app/relayer"]
          args: ["-config", "/app/config.yaml"]
          envFrom:
            - secretRef:
                name: canton-bridge-relayer-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: canton-bridge-relayer-config
