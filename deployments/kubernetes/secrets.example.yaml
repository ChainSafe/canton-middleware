# Copy to secrets.yaml, fill in the values, and apply it before the kustomization:
#   kubectl apply -f deployments/kubernetes/secrets.yaml
# secrets.yaml is git-ignored. Each key becomes an environment variable that the
# ${VAR} placeholders in config/*.yaml read at startup. Values are substituted into
# double-quoted YAML strings, so they must not contain " or \. Percent-encode any
# @ : / # ? in database passwords.
apiVersion: v1
kind: Secret
metadata:
  name: canton-middleware-api-secrets
  namespace: canton-middleware
type: Opaque
stringData:
  API_SERVER_DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/erc20_api?sslmode=require"
  CANTON_AUTH_CLIENT_ID: "CHANGE_ME"
  CANTON_AUTH_CLIENT_SECRET: "CHANGE_ME"
  # RSA key that signs SIWE session JWTs, as single-line base64 of its PEM. Generate with:
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl base64 -A
  # Plain `base64` wraps lines on Linux, which breaks startup.
  JWT_PRIVATE_KEY: "CHANGE_ME"
  # 32-byte AES key that encrypts custodial user keys at rest: openssl rand -base64 32
  # Losing it makes custodial keys unrecoverable.
  CANTON_MASTER_KEY: "CHANGE_ME"
  ADMIN_API_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: canton-indexer-secrets
  namespace: canton-middleware
type: Opaque
stringData:
  INDEXER_DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/canton_indexer?sslmode=require"
  CANTON_AUTH_CLIENT_ID: "CHANGE_ME"
  CANTON_AUTH_CLIENT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: canton-bridge-relayer-secrets
  namespace: canton-middleware
type: Opaque
stringData:
  RELAYER_DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/relayer?sslmode=require"
  ETHEREUM_RPC_URL: "https://CHANGE_ME"
  ETHEREUM_WS_URL: "wss://CHANGE_ME"
  # Hex private key of the account holding the relayer role on the bridge contract.
  ETHEREUM_RELAYER_PRIVATE_KEY: "CHANGE_ME"
  CANTON_AUTH_CLIENT_ID: "CHANGE_ME"
  CANTON_AUTH_CLIENT_SECRET: "CHANGE_ME"
